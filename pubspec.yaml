name: detectcoffee
description: "Deteksi Coffee Bean"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.3.0

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  image: ^4.5.4
  image_picker: ^1.0.4
  path: ^1.9.1
  permission_handler: ^11.0.1
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  
  android_12:
    icon_background_color: "#FFFFFF"
    
  fullscreen: true
  
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/model/
    - assets/images/
